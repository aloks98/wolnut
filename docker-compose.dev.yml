services:
  wol-nut:
    build:
      context: .
      args:
        VERSION: dev
        COMMIT: local
    container_name: wol-nut-dev
    network_mode: host
    cap_add:
      - NET_RAW  # ICMP ping for device status (falls back to TCP probe without it)
    volumes:
      - ./data:/data
    environment:
      - WOLNUT_LOG_LEVEL=debug
