name: Release

on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No explicit version: action-setup reads the pinned pnpm from the
      # packageManager field in web/package.json, matching the Docker build.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Get version
        id: version
        run: echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          LDFLAGS="-s -w -X main.version=$VERSION -X main.commit=${{ github.sha }}"

          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o wol-nut-linux-amd64
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o wol-nut-linux-arm64
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags "$LDFLAGS" -o wol-nut-linux-armv7

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            wol-nut-linux-amd64
            wol-nut-linux-arm64
            wol-nut-linux-armv7

      # Docker build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # node:24-slim doesn't ship a linux/arm/v7 manifest (Node dropped
          # 32-bit ARM around v23). Pi armv7 + Docker users are covered by
          # the wol-nut-linux-armv7 binary uploaded above.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
