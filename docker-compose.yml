services:
  wol-nut:
    image: ghcr.io/aloks98/wolnut:latest
    container_name: wol-nut
    restart: unless-stopped
    network_mode: host  # Required for WoL broadcast and NUT access
    cap_add:
      - NET_RAW  # ICMP ping for device status (falls back to TCP probe without it)
    volumes:
      - ./data:/data
      - ./config.yml:/app/config.yml:ro  # Optional
    environment:
      - WOLNUT_SERVER_PORT=8080
      - WOLNUT_LOG_LEVEL=info
      - TZ=America/New_York
    # Alternative to network_mode: host (limited WoL functionality)
    # ports:
    #   - "8080:8080"
