{{define "index"}}
{{template "head" .}}

<div class="space-y-8">
    <!-- UPS Section -->
    <section>
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold">UPS Status</h2>
            <button
                hx-get="/partials/ups-cards"
                hx-target="#ups-cards"
                hx-swap="innerHTML"
                class="px-3 py-1.5 bg-dark-800 hover:bg-gray-700 border border-gray-600 rounded-lg text-sm transition-colors flex items-center gap-2"
            >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Refresh
            </button>
        </div>

        <div
            id="ups-cards"
            hx-get="/partials/ups-cards"
            hx-trigger="every 30s"
            hx-swap="innerHTML"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
        >
            {{template "ups_cards" .UPSStatuses}}
        </div>
    </section>

    <!-- WOL Section -->
    <section>
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold">Wake-on-LAN Devices</h2>
            <a href="/devices" class="px-3 py-1.5 bg-dark-800 hover:bg-gray-700 border border-gray-600 rounded-lg text-sm transition-colors">
                Manage
            </a>
        </div>

        <div id="device-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {{template "device_list" .Devices}}
        </div>
    </section>
</div>

<script>
function batteryChart(charge) {
    return {
        chart: null,
        init() {
            const color = charge > 50 ? '#10b981' : charge > 20 ? '#f59e0b' : '#ef4444';
            this.chart = new Chart(this.$refs.chart, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [charge, 100 - charge],
                        backgroundColor: [color, '#1f2937'],
                        borderWidth: 0
                    }]
                },
                options: {
                    cutout: '70%',
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    },
                    animation: { duration: 500 }
                }
            });
        }
    }
}
</script>

{{template "foot" .}}
{{end}}
