{{define "head"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - WoL-NUT</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 800: '#1a1a2e', 900: '#0f0f1a' }
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="dark bg-dark-900 text-gray-100 min-h-screen">
    <nav class="bg-dark-800 border-b border-gray-700">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-xl font-bold flex items-center gap-2">
                <span>⚡</span> WoL-NUT
            </a>
            <div class="flex gap-6 text-sm">
                <a href="/" class="hover:text-emerald-400 transition-colors {{if eq .Page "dashboard"}}text-emerald-400{{end}}">Dashboard</a>
                <a href="/devices" class="hover:text-emerald-400 transition-colors {{if eq .Page "devices"}}text-emerald-400{{end}}">Devices</a>
                <a href="/ups" class="hover:text-emerald-400 transition-colors {{if eq .Page "ups"}}text-emerald-400{{end}}">UPS</a>
                <a href="/config/export" class="hover:text-emerald-400 transition-colors">Backup</a>
            </div>
        </div>
    </nav>

    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <main class="max-w-6xl mx-auto px-4 py-6">
{{end}}
