{{define "device_list"}}
{{range .}}
<div class="bg-dark-800 rounded-xl p-4 border border-gray-700">
    <div class="flex justify-between items-center">
        <div>
            <h3 class="font-semibold">{{.Name}}</h3>
            <p class="text-sm text-gray-400 font-mono">{{.MAC}}</p>
        </div>
        <button
            hx-post="/wake/{{.ID}}"
            hx-target="#toast-container"
            hx-swap="beforeend"
            class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-lg text-sm font-medium transition-colors flex items-center gap-2"
        >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            Wake
        </button>
    </div>
</div>
{{else}}
<div class="col-span-full text-center py-8 text-gray-400 bg-dark-800 rounded-xl border border-gray-700">
    <svg class="w-12 h-12 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
    </svg>
    <p>No devices configured.</p>
    <a href="/devices" class="text-emerald-400 hover:underline">Add a device</a>
</div>
{{end}}
{{end}}
